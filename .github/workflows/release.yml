name: Release

on:
  push:
    tags:
      - "v*"
  # Re-attach the Hex tarball, checksums, signature and attestation to the
  # Release of a tag that is already on Hex. Nothing is built or published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # A manual run only refreshes the assets of a published tag.
    if: github.event_name == 'push'
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same as the latest lane in ci.yml: formatter output differs between
      # compiler versions, and this job runs `gleam format --check`.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Lint (glinter, warnings as errors)
        run: gleam run -m glinter

      - name: Build (Erlang, warnings as errors)
        run: gleam build --warnings-as-errors --target erlang

      - name: Build (JavaScript, warnings as errors)
        run: gleam build --warnings-as-errors --target javascript

      - name: Test (Erlang)
        run: gleam test --target erlang

      - name: Test (JavaScript)
        run: gleam test --target javascript

      - name: Build docs
        run: gleam docs build

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"

      - name: Download dependencies
        run: gleam deps download

      - name: Build package
        run: gleam build

      - name: Publish to Hex
        run: echo 'I am not using semantic versioning' | gleam publish -y
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # id-token: keyless cosign signing and build provenance via GitHub OIDC.
    # attestations: publish the GitHub attestation for the package tarball.
    # contents: create the GitHub Release and upload assets.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # The assets are the tarball Hex serves, so they can only be fetched
    # after `gleam publish` has succeeded. A manual run skips publishing.
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    steps:
      - name: Extract tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::not a release tag: $tag"
            exit 1
          fi
          echo "TAG_NAME=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.TAG_NAME }}
          persist-credentials: false

      # Sign and attest the tarball Hex serves, not a rebuild: `gleam export
      # hex-tarball` stores the checkout's file mtimes, so a tarball built in
      # this job never matches the one `gleam publish` uploaded. The download
      # is accepted only when its sha256 equals the outer checksum Hex
      # records for the release. Retry while the CDN catches up.
      - name: Fetch the published tarball from Hex
        id: package
        env:
          TAG_NAME: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' gleam.toml | head -n 1)
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' gleam.toml | head -n 1)
          if [ "v${version}" != "$TAG_NAME" ]; then
            echo "::error::gleam.toml version ${version} does not match tag ${TAG_NAME}"
            exit 1
          fi
          tarball="${name}-${version}.tar"
          for attempt in $(seq 1 20); do
            if expected=$(curl -fsSL --retry 3 "https://hex.pm/api/packages/${name}/releases/${version}" | jq -er '.checksum | ascii_downcase') \
              && curl -fsSL --retry 3 -o "$tarball" "https://repo.hex.pm/tarballs/${name}-${version}.tar" \
              && actual=$(sha256sum "$tarball" | cut -d ' ' -f 1) \
              && [ "$actual" = "$expected" ]; then
              echo "Hex outer checksum matches: ${actual}"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::could not fetch ${name}-${version}.tar from Hex with the checksum Hex records"
              exit 1
            fi
            echo "Attempt ${attempt}: Hex tarball not available or checksum differs, retrying in 30s"
            sleep 30
          done
          sha256sum "$tarball" > checksums.txt
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "provenance=${name}-${version}.intoto.jsonl" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          TAG_WITHOUT_V="${TAG#v}"
          CHANGELOG_FILE="changelog_content.md"

          awk -v ver="$TAG_WITHOUT_V" '
            BEGIN { found = 0; }
            $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
            /^#{2,3} \[?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
            found { print; }
          ' CHANGELOG.md > "$CHANGELOG_FILE"

          if [ ! -s "$CHANGELOG_FILE" ]; then
            awk -v ver="$TAG" '
              BEGIN { found = 0; }
              $0 ~ "^#{2,3} \\[?" ver "\\]?" { found = 1; next; }
              /^#{2,3} \[?v?[0-9]+\.[0-9]+\.[0-9]+\]?/ { if (found) exit; }
              found { print; }
            ' CHANGELOG.md > "$CHANGELOG_FILE"
          fi

          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "No changelog entry found for version $TAG" > "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "Please check CHANGELOG.md for updates." >> "$CHANGELOG_FILE"
          fi

          {
            echo 'CHANGELOG_CONTENT<<EOF'
            cat "$CHANGELOG_FILE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checksums (cosign keyless)
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.tarball }}

      # Scorecard's Signed-Releases check looks for a *.intoto.jsonl release
      # asset. The attestation bundle is a single JSON line, which is the
      # in-toto/sigstore format that file name stands for.
      - name: Write provenance release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          PROVENANCE: ${{ steps.package.outputs.provenance }}
        run: jq -c . < "$BUNDLE_PATH" > "$PROVENANCE"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Install

            ```sh
            gleam add geokit
            ```

            See [HexDocs](https://hexdocs.pm/geokit) for the API
            reference.
          files: |
            ${{ steps.package.outputs.tarball }}
            checksums.txt
            checksums.txt.sigstore.json
            ${{ steps.package.outputs.provenance }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-alpha') || contains(steps.tag.outputs.TAG_NAME, '-beta') || contains(steps.tag.outputs.TAG_NAME, '-rc') }}
          generate_release_notes: false
          # A manual run for an older tag must not mark it as the latest release.
          make_latest: legacy
          # A manual run replaces the assets of an existing Release.
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
