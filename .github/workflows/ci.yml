name: CI

# Two compiler lanes:
# - floor (`floor`): the `gleam` requirement in gleam.toml (keep both in sync) on the
#   oldest maintained OTP and Node 22. It proves the declared minimum still builds
#   and passes the tests on both targets.
# - latest (`check`, `build-and-test`): floats on 1.x with OTP 29 so new compiler
#   warnings, deprecations and formatter changes surface here first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format / Lint / Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Download dependencies
        run: gleam deps download

      - name: Format check
        run: gleam format --check src/ test/

      - name: Type check
        run: gleam check

      - name: Lint (glinter, warnings as errors)
        run: gleam run -m glinter

  floor:
    name: Test (Gleam 1.14.0, OTP 27, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.14.0"
          rebar3-version: "3"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download dependencies
        run: gleam deps download

      - name: Test (Erlang)
        run: gleam test --target erlang

      - name: Test (JavaScript)
        run: gleam test --target javascript

  build-and-test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target: [erlang, javascript]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf input
          git config --global core.eol lf

      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.x"
          rebar3-version: "3"

      - name: Set up Node.js
        if: matrix.target == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Download dependencies
        run: gleam deps download

      - name: Build (warnings as errors)
        run: gleam build --warnings-as-errors --target ${{ matrix.target }}

      - name: Test
        run: gleam test --target ${{ matrix.target }}
